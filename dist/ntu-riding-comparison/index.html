<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17385f">
  <meta name="description" content="臺大校內外騎乘路線年度比較：2025虛線、2026實線，同月份使用相同顏色。">
  <title>臺大校內外騎乘年度比較地圖</title>
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="app.css?v=20261027-1">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">NTU RIDING FLOW</p>
      <h1>臺大校內外騎乘年度比較</h1>
      <p class="subtitle">平日且臺北當日用量超過 20 萬次｜同月同色、2025 虛線、2026 實線</p>
    </div>
    <a class="download" href="../files/臺大校內外騎乘_2025與2026年5月9月10月比較.xlsx">下載 Excel</a>
  </header>

  <section class="controls" aria-label="地圖篩選">
    <fieldset>
      <legend>年度</legend>
      <label><input type="checkbox" name="year" value="2025" checked><span class="line-sample dashed"></span>2025</label>
      <label><input type="checkbox" name="year" value="2026" checked><span class="line-sample solid"></span>2026</label>
    </fieldset>
    <fieldset>
      <legend>月份</legend>
      <label><input type="checkbox" name="month" value="05" checked><i class="dot may"></i>5月</label>
      <label><input type="checkbox" name="month" value="09"><i class="dot sep"></i>9月</label>
      <label><input type="checkbox" name="month" value="10"><i class="dot oct"></i>10月</label>
    </fieldset>
    <label class="control"><span>時段</span><select id="bandSelect"></select></label>
    <label class="control"><span>方向</span><select id="categorySelect"><option value="all">全部方向</option></select></label>
    <label class="control search"><span>搜尋站點</span><input id="stationSearch" type="search" placeholder="站名或代碼"></label>
    <label class="control min"><span>最低日均 <b id="minLabel">1.0</b></span><input id="minAverage" type="range" min="0" max="10" step="0.25" value="1"></label>
    <button id="resetButton" type="button">重設</button>
  </section>

  <main>
    <section class="map-panel">
      <div id="map" aria-label="臺大校內外騎乘路線地圖"></div>
      <div id="loading" class="loading"><span></span><b>載入路線資料…</b></div>
      <div class="legend">
        <strong>圖例</strong>
        <p><i class="legend-line may"></i>5月 <i class="legend-line sep"></i>9月 <i class="legend-line oct"></i>10月</p>
        <p><span class="line-sample dashed"></span>2025　<span class="line-sample solid"></span>2026</p>
        <small>線寬依「期間總量 ÷ 全部樣本日」計算；同一路線兩年會略微錯開，方便比較。</small>
      </div>
      <div id="mapMessage" class="map-message hidden"></div>
    </section>
    <aside>
      <div class="summary-head">
        <div><p class="eyebrow">FILTER RESULT</p><h2>篩選結果</h2></div>
        <strong id="routeCount">0</strong>
      </div>
      <div class="kpis">
        <div><span>路線</span><b id="routeKpi">0</b></div>
        <div><span>日均合計</span><b id="averageKpi">0</b></div>
        <div><span>樣本日</span><b id="sampleKpi">—</b></div>
      </div>
      <p class="status" id="statusText">準備資料中</p>
      <div class="table-wrap">
        <table>
          <thead><tr><th>期間／方向</th><th>起訖站</th><th>日均</th></tr></thead>
          <tbody id="routeRows"></tbody>
        </table>
      </div>
      <p class="note">清單依日均由高至低列前 80 條；點選列可定位路線。地圖仍呈現所有符合目前篩選的路線。</p>
    </aside>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="data/manifest.js?v=20261027-1"></script>
  <script src="app.js?v=20261027-1"></script>
</body>
</html>
